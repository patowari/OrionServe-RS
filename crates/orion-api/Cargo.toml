[package]
name = "orion-api"
description = "OpenAI-compatible HTTP API surface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
orion-core = { workspace = true }
orion-runtime = { workspace = true }
orion-observability = { workspace = true }
orion-tokenizer = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
futures = { workspace = true }
async-stream = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }

[dev-dependencies]
orion-models = { workspace = true }
orion-scheduler = { workspace = true }
orion-kv-cache = { workspace = true }
tokenizers = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
tower = { workspace = true, features = ["util"] }
